<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Foundry Westshore preview</title><desc id="desc">Source-faithful portfolio visualization of the THRIVE Foundry Westshore campaign page.</desc><rect width="1200" height="760" fill="#f8f2eb"/><rect x="52" y="42" width="1096" height="676" rx="30" fill="#fffaf3" stroke="#e4ddd3"/><rect x="650" y="42" width="498" height="676" rx="0 30 30 0" fill="#061510"/><circle cx="910" cy="250" r="145" fill="#006f5a" opacity=".32"/><circle cx="1000" cy="445" r="90" fill="#dcebe6" opacity=".09"/><text x="94" y="102" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">FOUNDRY WESTSHORE</text><text x="94" y="176" fill="#17100b" font-family="Georgia" font-size="54" font-weight="700">A new home</text><text x="94" y="237" fill="#17100b" font-family="Georgia" font-size="54" font-weight="700">for youth</text><text x="94" y="298" fill="#006f5a" font-family="Georgia" font-size="54" font-style="italic">wellness.</text><text x="94" y="350" fill="#5f675f" font-family="Arial" font-size="16">Integrated support for youth ages 12–24</text><text x="94" y="374" fill="#5f675f" font-family="Arial" font-size="16">across the Westshore, Sooke and Port Renfrew.</text><rect x="94" y="414" width="168" height="46" rx="23" fill="#006f5a"/><text x="121" y="443" fill="white" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">DONATE TO FOUNDRY</text><rect x="276" y="414" width="132" height="46" rx="23" fill="none" stroke="#e4ddd3"/><text x="305" y="443" fill="#17100b" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">CONTACT US</text><text x="94" y="532" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">INTEGRATED SERVICES</text><g font-family="Arial" font-size="13" fill="#17100b"><rect x="94" y="558" width="230" height="44" rx="14" fill="#f8f2eb" stroke="#e4ddd3"/><circle cx="117" cy="580" r=