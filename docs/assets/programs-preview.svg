<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">THRIVE programs preview</title><desc id="desc">Source-faithful portfolio visualization of THRIVE service pathways.</desc><rect width="1200" height="760" fill="#f8f2eb"/><text x="80" y="82" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">PROGRAM NAVIGATION</text><text x="80" y="138" fill="#17100b" font-family="Georgia" font-size="54" font-weight="700">Support built around <tspan fill="#006f5a" font-style="italic">people.</tspan></text><text x="80" y="174" fill="#5f675f" font-family="Arial" font-size="16">Clear pathways for families, youth, adults, referrals, and community partners.</text><g><rect x="80" y="225" width="500" height="190" rx="26" fill="#fffaf3" stroke="#e4ddd3"/><text x="110" y="263" fill="#5f675f" font-family="Arial" font-size="10" letter-spacing="2">CHILDREN · YOUTH · FAMILIES</text><text x="110" y="310" fill="#17100b" font-family="Georgia" font-size="33" font-weight="700">Family Services</text><text x="110" y="346" fill="#5f675f" font-family="Arial" font-size="15">Parenting support, youth outreach, mental health,</text><text x="110" y="369" fill="#5f675f" font-family="Arial" font-size="15">family preservation and employment services.</text><rect x="445" y="248" width="102" height="34" rx="17" fill="#dcebe6"/><text x="464" y="270" fill="#006f5a" font-family="Arial" font-size="10" font-weight="700">8 PROGRAMS</text><rect x="620" y="225" width="500" height="190" rx="26" fill="#061510"/><text x="650" y="263" fill="#dcebe6" font-family="Arial" font-size="10" letter-spacing="2">ADULT SERVICES</text><text x="650" y="310" fill="#f8f2eb" font-family="Georgia" font-size="33" font-weight="700">Adults with Disabilities</text><text x="650" y="346" fill="#f8f2eb" opacity=".72" font-family="Arial" font-size="15">Community inclusion, employment support,</text><text x="650" y="369" fill="#f8f2eb" opacity=".72" font-family="Arial" font-size="15">day programs and social connection.</text><rect x="985" y="248" width="102" height="34" rx="17" fill="#006f5a"/><text x="1005" y="270" fill="white" font-family="Arial" font-size="10" font-weight="700">4 PROGRAMS</text><rect x="80" y="445" width="500" height="190" rx="26" fill="#fffaf3" stroke="#e4ddd3"/><text x="110" y="483" fill="#5f675f" font-family="Arial" font-size="10" letter-spacing="2">YOUTH WELLNESS · AGES 12–24</text><text x="110" y="530" fill="#17100b" font-family="Georgia" font-size="33" font-weight="700">Foundry Westshore</text><text x="110" y="566" fill="#5f675f" font-family="Arial" font-size="15">Integrated mental health, substance use, physical</text><text x="110" y="589" fill="#5f675f" font-family="Arial" font-size="15">health, peer support and community services.</text><rect x="440" y="468" width="108" height="34" rx="17" fill="#006f5a"/><text x="459" y="490" fill="white" font-family="Arial" font-size="10" font-weight="700">OPENING 2028</text><rect x="620" y="445" width="500" height="190" rx="26" fill="#fffaf3" stroke="#e4ddd3"/><text x="650" y="483" fill="#5f675f" font-family="Arial" font-size="10" letter-spacing="2">EMPLOYMENT · AGES 15–25</text><text x="650" y="530" fill="#17100b" font-family="Georgia" font-size="33" font-weight="700">Rise Up Employment</text><text x="650" y="566" fill="#5f675f" font-family="Arial" font-size="15">Employment support for young people facing</text><text x="650" y="589" fill="#5f675f" font-family="Arial" font-size="15">barriers, designed to meet them where they are.</text><rect x="80" y="676" width="1040" height="1" fill="#e4ddd3"/><text x="80" y="710" fill="#006f5a" font-family="Georgia" font-size="20" font-style="italic">Find the right support →</text></g></svg>