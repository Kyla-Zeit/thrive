<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">THRIVE support pathway preview</title><desc id="desc">Source-faithful portfolio visualization of THRIVE Get Help and donation flows.</desc><rect width="1200" height="760" fill="#f8f2eb"/><text x="74" y="76" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">GET HELP</text><text x="74" y="135" fill="#17100b" font-family="Georgia" font-size="51" font-weight="700">Looking for a place to <tspan fill="#006f5a" font-style="italic">start?</tspan></text><text x="74" y="172" fill="#5f675f" font-family="Arial" font-size="16">Low-pressure pathways to services, referrals, community resources and immediate support.</text><rect x="74" y="220" width="510" height="185" rx="26" fill="#fffaf3" stroke="#e4ddd3"/><text x="104" y="257" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">01</text><text x="104" y="304" fill="#17100b" font-family="Georgia" font-size="30" font-weight="700">Community Referral</text><text x="104" y="340" fill="#5f675f" font-family="Arial" font-size="15">A community professional can contact THRIVE</text><text x="104" y="363" fill="#5f675f" font-family="Arial" font-size="15">to identify a suitable starting point.</text><text x="104" y="388" fill="#006f5a" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">CONTACT US →</text><rect x="616" y="220" width="510" height="185" rx="26" fill="#fffaf3" stroke="#e4ddd3"/><text x="646" y="257" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">02</text><text x="646" y="304" fill="#17100b" font-family="Georgia" font-size="30" font-weight="700">MCFD or CLBC Referral</text><text x="646" y="340" fill="#5f675f" font-family="Arial" font-size="15">Some services begin with a formal referral</text><text x="646" y="363" fill="#5f675f" font-family="Arial" font-size="15">from a provincial service partner.</text><text x="646" y="388" fill="#006f5a" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">LEARN ABOUT MCFD ↗</text><rect x="74" y="442" width="1052" height="94" rx="24" fill="#061510"/><text x="104" y="476" fill="#dcebe6" font-family="Arial" font-size="10" letter-spacing="3">IMMEDIATE SUPPORT</text><text x="104" y="510" fill="#f8f2eb" font-family="Georgia" font-size="28" font-weight="700">Need help right now?</text><rect x="854" y="466" width="230" height="46" rx="23" fill="#006f5a"/><text x="894" y="495" fill="white" font-family="Arial" font-size="12" font-weight="700">1-800-784-2433</text><text x="74" y="592" fill="#5f675f" font-family="Arial" font-size="11" letter-spacing="3">MAKE A DIFFERENCE</text><text x="74" y="642" fill="#17100b" font-family="Georgia" font-size="38" font-weight="700">Build <tspan fill="#006f5a" font-style="italic">stronger</tspan> futures.</text><g font-family="Georgia" font-size="22" font-weight="700"><rect x="590" y="574" width="110" height="62" rx="18" fill="#fffaf3" stroke="#e4ddd3"/><text x="621" y="613" fill="#17100b">$25</text><rect x="712" y="574" width="110" height="62" rx="18" fill="#fffaf3" stroke="#e4ddd3"/><text x="743" y="613" fill="#17100b">$50</text><rect x="834" y="574" width="110" height="62" rx="18" fill="#fffaf3" stroke="#006f5a"/><text x="861" y="613" fill="#006f5a">$100</text><rect x="956" y="574" width="110" height="62" rx="18" fill="#fffaf3" stroke="#e4ddd3"/><text x="982" y="613" fill="#17100b">$250</text></g><rect x="590" y="654" width="476" height="48" rx="24" fill="#006f5a"/><text x="730" y="684" fill="white" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">CONTINUE TO DONATE →</text></svg>